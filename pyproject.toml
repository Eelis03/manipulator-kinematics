[project]
name = "manipulator-kinematics"
version = "0.1.0"
description = "Forward and inverse kinematics for serial manipulators with Jacobian conditioning and singularity detection."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Yilmaz" }]
keywords = ["robotics", "kinematics", "inverse-kinematics", "manipulator", "python"]
dependencies = ["numpy>=2.0", "scipy>=1.14", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manipulator_kinematics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: excluded from the default run"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/manipulator_kinematics", "tests", "examples"]

# SciPy ships no type information and the scipy-stubs package is not one of the
# dependencies this repository is allowed to add, so the four SciPy entry points
# used here are treated as untyped at the import boundary only. Every value that
# crosses that boundary is annotated at the call site.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
